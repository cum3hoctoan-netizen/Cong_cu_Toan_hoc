<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luyện Tập Phương Trình Bậc Hai</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- KaTeX: Thư viện hiển thị công thức Toán chuẩn LaTeX -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <main class="card">
      <!-- Header -->
      <header class="card-header">
        <div class="badge-tag">Toán Học Lớp 9 - 10</div>
        <h1 class="card-title">Phương Trình Bậc Hai</h1>
        <p class="card-subtitle">Thực hành giải phương trình dạng <em>ax² + bx + c = 0</em></p>
      </header>

      <!-- Action Button 1: Tạo bài toán -->
      <div class="action-section">
        <button id="btnGenerate" class="btn btn-primary" type="button">
          <svg class="btn-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
          </svg>
          <span>Tạo bài toán</span>
        </button>
      </div>

      <!-- Equation Display Box -->
      <section class="equation-container" aria-label="Phương trình hiện tại">
        <div class="equation-label">Đề bài:</div>
        <div id="equationDisplay" class="equation-text">
          <span class="placeholder-text">Bấm nút "Tạo bài toán" để bắt đầu</span>
        </div>
      </section>

      <!-- Action Button 2: Xem đáp án -->
      <div class="solution-actions">
        <button id="btnToggleSolution" class="btn btn-secondary" type="button" disabled>
          <svg class="btn-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
          <span id="solutionBtnText">Xem đáp án</span>
        </button>
      </div>

      <!-- Solution Area -->
      <section id="solutionCard" class="solution-card hidden" aria-live="polite">
        <div class="solution-header">
          <h2 class="solution-title">Lời giải chi tiết</h2>
          <span id="solutionTypeBadge" class="status-badge"></span>
        </div>

        <div class="solution-content">
          <!-- Bước 1: Hệ số -->
          <div class="step-item">
            <div class="step-num">1</div>
            <div class="step-body">
              <div class="step-title">Xác định các hệ số:</div>
              <div id="stepCoefficients" class="math-expr"></div>
            </div>
          </div>

          <!-- Bước 2: Tính Delta -->
          <div class="step-item">
            <div class="step-num">2</div>
            <div class="step-body">
              <div class="step-title">Tính biệt thức Delta (Δ):</div>
              <div id="stepDeltaCalculation" class="math-expr"></div>
            </div>
          </div>

          <!-- Bước 3: Kết luận nghiệm -->
          <div class="step-item">
            <div class="step-num">3</div>
            <div class="step-body">
              <div class="step-title">Kết luận nghiệm:</div>
              <div id="stepRoots" class="math-expr roots-highlight"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- Footer Note -->
      <footer class="card-footer">
        <p>Hệ số <em>a</em>, <em>b</em>, <em>c</em> được tạo ngẫu nhiên trong đoạn [-10, 10] với <em>a ≠ 0</em>.</p>
      </footer>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
